name: Android test APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'plugins/**'
      - 'modules/**'
      - 'assets/**'
      - 'app.json'
      - 'package*.json'
      - '*config*'
      - 'index.ts'
      - '.github/workflows/android-apk.yml' 
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006'
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - run: npm run verify
      - run: npm run prebuild:android
      # Release JS bundle, debug signing for internal testing only. No signing secrets.
      - name: Build installable test APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: WalkWorld-android-arm64-test
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
